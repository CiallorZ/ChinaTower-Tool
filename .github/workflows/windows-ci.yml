name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-package:
    name: Build, test and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        shell: pwsh
        run: dotnet --info

      - name: Full build and test gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1 -Configuration Release

      - name: Build unsigned diagnostic package
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/publish.ps1
          -Configuration Release
          -RuntimeIdentifier win-x64
          -SkipTests

      - name: Upload portable diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: LinkForge-win-x64-diagnostic-${{ github.sha }}
          path: |
            artifacts/LinkForge-*-win-x64-portable.zip
            artifacts/LinkForge-*-win-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record unsigned package boundary
        shell: pwsh
        run: |
          @"
          LinkForge CI completed build and test verification.
          The uploaded portable ZIP is unsigned and is not a formal release.
          Formal releases require a clean tagged commit and build-release.ps1 -Formal.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
